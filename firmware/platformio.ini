[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_ignore = *
board_build.partitions = partitions/ota_4MB.csv
extra_scripts =
    pre:scripts/load_secrets.py
    pre:scripts/embed_web.py
build_flags =
    -D FIRMWARE_VERSION='"0.1.0"'
lib_deps =
    pololu/PololuMaestro@^1.0.0

[env:native]
platform = native
build_flags =
    -I test/mocks
    -I src
    -std=c++11
    -D UNIT_TEST
test_build_src = true
build_src_filter = +<*> +<../test/mocks/>
lib_ignore =
    PololuMaestro
